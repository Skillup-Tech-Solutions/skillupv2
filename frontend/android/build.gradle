// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    
    // Fix Kotlin stdlib duplicate class errors across ALL modules
    // (including capacitor-cordova-android-plugins)
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                // Force all Kotlin stdlib variants to use consistent version
                if (details.requested.name.startsWith('kotlin-stdlib')) {
                    details.useVersion '1.9.24'
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
